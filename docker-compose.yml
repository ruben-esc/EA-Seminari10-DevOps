name: seminario10

services:
  mongodb:
    image: mongo:8
    container_name: seminario10-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - seminario-net

  api:
    image: ghcr.io/mbakkali28/ea-seminari10-devops-backend:latest
    container_name: seminario10-api
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      MONGO_URL: "mongodb://mongodb:27017/${MONGO_DB:-seminari7}"
      # El middleware de CORS acepta un solo origen.
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      SERVER_PORT: 1337
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en el fichero de entorno}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET en el fichero de entorno}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-15m}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
    depends_on:
      - mongodb
    networks:
      - seminario-net

  angular:
    image: ghcr.io/alikoubiiss/devop:latest
    container_name: seminario10-angular
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - seminario-net

  react:
    image: ghcr.io/mbakkali28/ea-seminari10-devops-react:latest
    container_name: seminario10-react
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - api
    networks:
      - seminario-net

networks:
  seminario-net:
    driver: bridge

volumes:
  mongo-data:
